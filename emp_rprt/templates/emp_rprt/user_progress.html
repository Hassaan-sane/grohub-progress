
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Progress</title>
    <style>
      .button,
      button {
        background-color: #007bff;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.3s;
      }
      body {
          font-family: Arial, sans-serif; /* Set a clean font */
          background-color: #e2e2e2; /* Light background for the page */
          margin: 0;
          padding: 20px;
      }

      table {
          width: 100%;
          border-collapse: collapse; /* Remove space between cells */
          border-radius: 10px; /* Rounded corners */
          overflow: hidden; /* Hide overflow */
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
      }

      th, td {
          font-family: Arial, sans-serif;
          padding: 12px; /* Increased padding for better spacing */
          text-align: left; /* Align text to the left */
      }

      th {
          background-color: #007bff; /* Blue background for headers */
          color: white; /* White text color */
          font-weight: bold; /* Bold text */
      }

      tbody tr:nth-child(even) {
          background-color: #f2f2f2; /* Light grey for even rows */
      }

      tbody tr:hover {
          background-color: #e0e0e0; /* Highlight row on hover */
      }

      .dropdown {
          width: 20%; /* Full width for the dropdown */
          padding: 8px; /* Padding for dropdown */
          border: 1px solid #ced4da; /* Border */
          border-radius: 5px; /* Rounded corners */
          appearance: none; /* Remove default dropdown arrow */
          background-color: #fff; /* White background */
          cursor: pointer; /* Pointer cursor for dropdown */
      }

      .no-data {
          text-align: center; /* Center text for no data */
          font-style: italic; /* Italic style for emphasis */
      }
      .btn-save, .logout-button {
          margin-left: 10px; /* Add space between buttons */
          padding: 10px 15px; /* Adjust padding for better appearance */
          text-decoration: none; /* Remove underline from the link */
          border: none; /* Remove border from button */
          border-radius: 5px; /* Rounded corners */
          cursor: pointer; /* Pointer cursor on hover */
          transition: background-color 0.3s; /* Smooth transition */
      }
      .btn-save {
          background-color: #4CAF50; /* Green background for save */
          color: white; /* White text */
      }
      .btn-save:hover {
          background-color: #218838; /* Darker green on hover */
      }
      .logout-form {
          display: inline; /* Keeps the form inline with other elements */
      }
      .logout-button {
          background-color: #ff4c4c; /* Red background for logout */
          color: white; /* White text color */
          padding: 10px 20px; /* Padding for the button */
          border: none; /* No border */
          border-radius: 5px; /* Rounded corners */
          cursor: pointer; /* Pointer cursor on hover */
          transition: background-color 0.3s; /* Transition for hover effect */
      }

      .logout-button:hover {
          background-color: #ff1a1a; /* Darker red on hover */
      }
      .button-container {
          display: flex; /* Use flexbox for layout */
          justify-content: flex-end; /* Align items to the right */
          align-items: center; /* Vertically center items */
          margin: 20px; /* Add some margin if needed */
      }
    </style>
  </head>
  <body >
    <div style="margin-bottom: 20px;"><a href="{% url 'dashboard' %}"  style="text-align: center; margin-bottom:20px;" class="button">Back</a></div>
    <div><form method="GET">
    <label for="user">Select User:</label>
    <select  class="dropdown"  name="user" id="user">
        {% for user in users %}
            <option value="{{ user.id }}" {% if selected_user == user %}selected{% endif %}>{{ user.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" name="range" value="today">Today</button>
    <button type="submit" name="range" value="yesterday">Yesterday</button>
    <button type="submit" name="range" value="last_7_days">Last 7 Days</button>
    <button type="submit" name="range" value="last_30_days">Last 30 Days</button>
</form></div>

<table>
    <thead>
        <tr>
            <th>Date</th>
            {% for aw in allowed_work %}
                <th>{{ aw.work.title }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for date, progress_count in new_list.items %}
        <tr>
            {% for count in progress_count %}
            {% if count %}
                <td>{{ count }}</td>
            {% else %}
                <td>NA</td>
            {% endif %}
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
